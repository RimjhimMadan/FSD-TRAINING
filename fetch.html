<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products</title>

  <style>
    table, th, td {
      border: 1px solid rgb(152, 36, 36);
      
    }

    th, td {
      padding: 10px;
    }
  </style>
</head>

<body>

  <table>
    <thead>
      <tr>
        <th>Sr. No</th>
        <th>Title</th>
        <th>images</th>
        <th>Category</th>
        <th>Price</th>
        <th>Rating</th>
        
        <th>stock</th>
        <th>actions</th>

      </tr>
    </thead>

    <tbody id="data">
    </tbody>
  </table>

  <script>
    let rate=0;
    const URL = "https://dummyjson.com/products";

    const el = document.getElementById("data");

    async function loadproduct() {

      try {

        const response = await fetch(URL);

        const data = await response.json();

        console.log(data);

        data.products.map((product, index) => {

          el.innerHTML += `
            <tr>
              <td>${index + 1}</td>
              <td>${product.title}</td>
              <td><img src="${product.images[0]}" width="100" height="50"></td>
              <td>${product.category}</td>
              
              <td>${product.rating}</td>
              
              <td>${product.stock}</td>
              <td><button >Add to Cart</td>
              
              
            </tr>
          `;

        });

      } catch (error) {

        console.error("Error fetching product data:", error);

      }
      async function getrate(){

        const URL="https://open.er-api.com/v6/latest/USD";
        try{
          const res= await fetch(URL);
          const ratedata=awaitres.json();
          console.log("INR rate=",ratedata.rates.INR)
          return ratedata.rates.INR;}
          catch(error){
            console.log(error);
          }
          const test =async()=>{
            rate= await getrate();
          }
          test();
          getproducts();
        

      }

    }

    loadproduct();

  </script>

</body>
</html>
